
name: VOX Cinema Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vox-cinema-monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run VOX monitor
        env:
          TOKEN: ${{ secrets.TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python check.py

      - name: Save seen data
        run: |
          git config user.name "VOX Cinema Bot"
          git config user.email "bot@users.noreply.github.com"

          if [ -f seen.json ]; then
            git add seen.json
          fi

          if ! git diff --cached --quiet; then
            git commit -m "Update VOX seen data"
            git push
          else
            echo "No changes to save."
          fi
